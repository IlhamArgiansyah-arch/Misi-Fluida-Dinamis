<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misi Fluida Dinamis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Tata letak: meja lab (simulasi + data) di kiri, panduan misi bertahap di kanan */
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface2:#e3ecf1; --ink:#12303f; --muted:#587080; --line:#c9d7df;
  --water:#2a9fd0; --deep:#0f6c98; --pipe:#7d8f9a; --accent:#e2611b; --accent-ink:#ffffff;
  --good:#1c8a55; --good-bg:#dff3e8; --bad:#c23a2e; --bad-bg:#fae3e0; --warn-bg:#fdf0d8;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1c25; --surface:#152a36; --surface2:#1d3847; --ink:#e4eff5; --muted:#93acba; --line:#2d4b5c;
  --water:#45b6e6; --deep:#1f86b5; --pipe:#8fa3ae; --accent:#ff8a4a; --accent-ink:#1a0d04;
  --good:#5fd09a; --good-bg:#143a2a; --bad:#ff8d82; --bad-bg:#472220; --warn-bg:#40331a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1c25; --surface:#152a36; --surface2:#1d3847; --ink:#e4eff5; --muted:#93acba; --line:#2d4b5c;
  --water:#45b6e6; --deep:#1f86b5; --pipe:#8fa3ae; --accent:#ff8a4a; --accent-ink:#1a0d04;
  --good:#5fd09a; --good-bg:#143a2a; --bad:#ff8d82; --bad-bg:#472220; --warn-bg:#40331a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{font-size:22px;letter-spacing:-.01em}
header h1 span{color:var(--deep)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.who input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:170px}
.who input#kelas{width:90px}
nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
nav a{display:flex;align-items:center;gap:8px;padding:9px 13px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;border-radius:8px 8px 0 0;margin-bottom:-2px;border-bottom:2px solid transparent}
nav a .n{font-family:var(--f-display);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink)}
nav a.on{color:var(--ink);background:var(--surface);border-bottom-color:var(--accent)}
nav a.done .n{background:var(--good);color:#fff}
nav a.lock{opacity:.55}
.lab{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.bench{display:flex;flex-direction:column;gap:12px}
canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:8px;background:var(--surface2)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px}
.ctrl label{display:flex;flex-direction:column;font-size:14px;color:var(--muted);gap:2px}
.ctrl label b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctrl input[type=range]{accent-color:var(--deep);width:100%}
.ctrl.off{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td:first-child,th:first-child{text-align:left}
th.new,td.new{background:var(--warn-bg)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps button{flex:1;border:0;background:var(--surface2);color:var(--muted);padding:6px 2px;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer}
.steps button.cur{background:var(--deep);color:#fff}
.steps button.past{background:var(--good-bg);color:var(--good)}
.steps button:disabled{cursor:default;opacity:.6}
.guide h2{font-size:19px;margin-bottom:8px}
.guide p{margin:0 0 10px;max-width:62ch}
.guide ol,.guide ul{margin:0 0 10px;padding-left:20px}
.q{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.q p{margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:7px 10px;cursor:pointer}
.opt.sel{border-color:var(--deep);background:var(--surface)}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.fb{font-size:14.5px;padding:7px 10px;border-radius:6px;margin-top:8px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.hint{background:var(--warn-bg);color:var(--ink)}
.eq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:44px;border:2px dashed var(--line);border-radius:8px;padding:6px 10px;margin-bottom:8px;font-family:var(--f-display);font-size:17px}
.eq.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:var(--f-display);font-size:15px}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.concept{border-left:4px solid var(--deep);background:var(--surface2);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:10px}
.concept .f{font-family:var(--f-display);font-size:19px;margin-bottom:4px}
textarea{width:100%;min-height:74px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans input{width:130px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.pts{font-size:13px;color:var(--muted);margin-left:auto}
.finish{background:var(--good-bg);border:1px solid var(--good);border-radius:10px;padding:14px}
.finish .stars{font-size:28px;color:var(--accent);letter-spacing:4px}
.code{font-family:var(--f-display);font-size:20px;background:var(--surface);border:1px dashed var(--good);border-radius:6px;padding:3px 10px;display:inline-block}
.lockbox{max-width:520px;margin:30px auto}
.lockbox input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:180px;text-transform:uppercase}
.note h2{font-size:18px;margin:0 0 6px}
.note .card{margin-bottom:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--good-bg);color:var(--good)}
small.m{color:var(--muted)}
.who a{color:var(--deep)}
.gf{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px;margin-bottom:12px}
.gf label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted)}
.gf input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink)}
@media print{header .who a,nav,.btn,#gform,#cmsg,#actmsg{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:6px 0;break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Misi <span>Fluida Dinamis</span></h1>
    <div class="who">
      <span id="grp"></span><a href="#catatan">Ubah data kelompok</a><span id="total"></span>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
const G=10, STAGES=["Fenomena","Prediksi","Eksperimen","Temukan Pola","Rumuskan","Tantangan"];
const f=(x,d=2)=>Number(x).toLocaleString("id-ID",{maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sortEq=(a,b)=>a.slice().sort().join("|")===b.slice().sort().join("|");
const pick=(list,s)=>list[s%list.length];

/* ---------- Definisi misi ---------- */
const M=[
{ id:1, title:"Debit",
  story:["Dua keran dipakai mengisi ember 10 liter. Keran pertama memenuhi ember dalam 20 detik, keran kedua butuh 50 detik.","Air di keduanya sama-sama mengalir. Besaran apa yang membedakan kedua aliran itu, dan apa saja yang menentukannya? Di misi ini kamu menjadi teknisi yang menyelidikinya."],
  pred:{q:"Luas penampang pipa diperbesar 2 kali, kecepatan air tetap. Waktu untuk memenuhi ember yang sama akan…",o:["tetap sama","menjadi setengahnya","menjadi dua kali lebih lama"],a:1},
  ctrl:[{k:"A",l:"Luas penampang pipa A",u:"cm²",min:2,max:10,step:1,v:4},{k:"v",l:"Kecepatan air v",u:"m/s",min:0.5,max:3,step:0.5,v:1},{k:"V",l:"Volume wadah V",u:"L",min:5,max:20,step:5,v:10}],
  act:"Buka keran",
  cols:[{k:"A",l:"A (cm²)"},{k:"v",l:"v (m/s)"},{k:"V",l:"V (L)"},{k:"t",l:"t (s)"},{k:"Q",l:"V/t (L/s)",from:3},{k:"Av",l:"A×v (L/s)*",from:3}],
  colNote:"*A×v sudah dikonversi: 1 cm² × 1 m/s = 10⁻⁴ m³/s = 0,1 L/s.",
  how:["Atur luas penampang, kecepatan air, dan volume wadah.","Tekan Buka keran. Stopwatch berjalan sampai wadah penuh, lalu data tercatat otomatis.","Kumpulkan minimal 4 data. Ubah A dengan v tetap, lalu ubah v dengan A tetap."],
  req:r=>r.length<4?"Butuh minimal 4 data (sekarang "+r.length+").":new Set(r.map(x=>x.A)).size<2?"Coba minimal 2 nilai A yang berbeda.":new Set(r.map(x=>x.v)).size<2?"Coba minimal 2 nilai v yang berbeda.":null,
  pat:[
   {q:"Lihat kolom V/t. Besaran ini menyatakan…",o:["volume air yang mengalir tiap detik","jarak yang ditempuh air tiap detik","massa air di dalam wadah"],a:0,h:"Perhatikan satuannya: liter per sekon.",e:"V/t adalah volume fluida yang lewat tiap satuan waktu. Besaran ini disebut debit (Q)."},
   {q:"Saat A dibuat 2 kali lebih besar dan v tetap, nilai V/t…",o:["tetap","menjadi 2 kali","menjadi setengah"],a:1,h:"Bandingkan dua baris data dengan v sama tetapi A berbeda.",e:"Debit sebanding dengan luas penampang."},
   {q:"Bandingkan kolom V/t dengan kolom A×v pada setiap baris.",o:["Selalu sama","V/t selalu lebih besar","Tidak ada hubungan"],a:0,h:"Baca kedua kolom berwarna pada baris yang sama.",e:"Debit dapat dihitung dari V/t maupun dari A×v."}],
  bld:[{lhs:"Q =",tip:"Debit dari volume dan waktu",tok:["V","t","A","v","×","÷","+"],ok:a=>a.join("")==="V÷t"},
       {lhs:"Q =",tip:"Debit dari penampang dan kecepatan",tok:["V","t","A","v","×","÷","+"],ok:a=>["A×v","v×A"].includes(a.join(""))}],
  concept:{f:"Q = V / t = A · v",t:"Debit (Q) adalah volume fluida yang mengalir tiap satuan waktu. Satuan SI: m³/s. Ingat 1 L = 10⁻³ m³ dan 1 cm² = 10⁻⁴ m²."},
  qs:[
   s=>{const [V,t]=pick([[120,4],[180,5],[96,4]],s),a=V/(t*60);return{t:`Sebuah bak ${V} liter terisi penuh dalam ${t} menit. Berapa debit keran?`,u:"L/s",a,h:"Q = V/t. Ubah menit ke sekon dulu.",s:`Q = ${V} L / ${t*60} s = ${f(a)} L/s`}},
   s=>{const [d,v]=pick([[4,2],[2,3],[6,1]],s),A=Math.PI*d*d/4,a=A*v*0.1;return{t:`Air mengalir dengan kecepatan ${f(v)} m/s dalam pipa berdiameter ${d} cm. Berapa debitnya? (π = 3,14)`,u:"L/s",a,h:"Hitung A = πr² dalam m², lalu Q = A·v. 1 m³/s = 1000 L/s.",s:`A = π(${d/2} cm)² = ${f(A)} cm² = ${f(A)}×10⁻⁴ m². Q = A·v = ${f(a/1000,5)} m³/s = ${f(a)} L/s`}},
   s=>{const [A,v,V]=pick([[5,2,1.2],[4,2.5,0.9],[8,1.5,1.8]],s),Q=A*v*1e-4,a=V/Q/60;return{t:`Selang berpenampang ${A} cm² mengalirkan air dengan kecepatan ${f(v)} m/s. Berapa lama mengisi kolam ${f(V)} m³?`,u:"menit",a,h:"Cari Q = A·v dalam m³/s, lalu t = V/Q.",s:`Q = ${A}×10⁻⁴ × ${f(v)} = ${f(Q,5)} m³/s. t = ${f(V)} / ${f(Q,5)} = ${f(V/Q,0)} s = ${f(a)} menit`}}]
},
{ id:2, title:"Asas Kontinuitas",
  story:["Saat menyiram tanaman, kamu memencet ujung selang dan air memancar lebih jauh. Padahal keran tidak kamu putar sama sekali.","Mengapa menyempitkan lubang membuat air lebih cepat? Selidiki dengan pipa yang penampangnya bisa diubah."],
  pred:{q:"Air mengalir dari pipa besar ke pipa yang luas penampangnya setengahnya. Kecepatan air di pipa kecil akan…",o:["tetap","menjadi setengahnya","menjadi 2 kali","menjadi 4 kali"],a:2},
  ctrl:[{k:"A1",l:"Luas penampang 1 (A₁)",u:"cm²",min:4,max:20,step:2,v:16},{k:"v1",l:"Kecepatan di penampang 1 (v₁)",u:"m/s",min:0.5,max:3,step:0.5,v:1},{k:"A2",l:"Luas penampang 2 (A₂)",u:"cm²",min:2,max:20,step:2,v:8}],
  act:"Catat data",
  cols:[{k:"A1",l:"A₁ (cm²)"},{k:"v1",l:"v₁ (m/s)"},{k:"A2",l:"A₂ (cm²)"},{k:"v2",l:"v₂ (m/s)"},{k:"Q1",l:"A₁·v₁",from:3},{k:"Q2",l:"A₂·v₂",from:3}],
  colNote:"A·v dalam cm²·m/s.",
  how:["Ubah A₂ dan amati gerak partikel air serta pembacaan v₂.","Tekan Catat data untuk setiap susunan.","Kumpulkan minimal 4 data dengan minimal 3 nilai A₂ berbeda. Coba juga A₂ lebih besar dari A₁."],
  req:r=>r.length<4?"Butuh minimal 4 data (sekarang "+r.length+").":new Set(r.map(x=>x.A2)).size<3?"Coba minimal 3 nilai A₂ yang berbeda.":null,
  pat:[
   {q:"Saat pipa menyempit (A₂ lebih kecil dari A₁), kecepatan v₂…",o:["lebih besar dari v₁","lebih kecil dari v₁","sama dengan v₁"],a:0,h:"Lihat baris dengan A₂ < A₁.",e:"Di penampang yang lebih sempit, fluida bergerak lebih cepat."},
   {q:"Bandingkan kolom A₁·v₁ dan A₂·v₂ di setiap baris.",o:["Selalu sama","Lebih besar di pipa sempit","Lebih besar di pipa lebar"],a:0,h:"Baca kedua kolom berwarna.",e:"Hasil kali A·v sama di setiap penampang."},
   {q:"A·v adalah debit. Mengapa debit di kedua penampang harus sama?",o:["Air yang masuk tiap detik harus sama dengan yang keluar, karena air tidak menumpuk dan tidak dapat dimampatkan","Karena tekanan di kedua ujung pipa sama","Karena pipa terbuat dari bahan yang sama"],a:0,h:"Bayangkan jika air masuk lebih banyak daripada yang keluar.",e:"Fluida ideal tidak termampatkan, sehingga debit di sepanjang pipa tetap."}],
  bld:[{lhs:"",tip:"Susun persamaan yang menghubungkan kedua penampang",tok:["A₁","A₂","v₁","v₂","×","÷","+","="],ok:a=>{const s=a.join("").split("=");return s.length===2&&sortEq(s.map(x=>x.split("×").sort().join("×")),["A₁×v₁","A₂×v₂"])}}],
  concept:{f:"A₁ · v₁ = A₂ · v₂",t:"Asas kontinuitas: debit fluida ideal sama di setiap penampang. Penampang mengecil, kecepatan membesar. Untuk pipa bulat A = πr², sehingga v₂/v₁ = (d₁/d₂)²."},
  qs:[
   s=>{const [A1,v1,A2]=pick([[10,2,4],[12,1.5,3],[8,3,6]],s),a=A1*v1/A2;return{t:`Air mengalir ${f(v1)} m/s di pipa berpenampang ${A1} cm², lalu masuk ke pipa ${A2} cm². Berapa kecepatannya di pipa kedua?`,u:"m/s",a,h:"A₁v₁ = A₂v₂.",s:`v₂ = A₁v₁/A₂ = ${A1}×${f(v1)}/${A2} = ${f(a)} m/s`}},
   s=>{const [d1,d2,v1]=pick([[6,2,1],[8,4,1.5],[10,5,0.5]],s),a=v1*d1*d1/(d2*d2);return{t:`Pipa berdiameter ${d1} cm menyempit menjadi ${d2} cm. Kecepatan air di bagian besar ${f(v1)} m/s. Berapa kecepatan di bagian kecil?`,u:"m/s",a,h:"Luas sebanding dengan kuadrat diameter: v₂ = v₁(d₁/d₂)².",s:`v₂ = ${f(v1)} × (${d1}/${d2})² = ${f(a)} m/s`}},
   s=>{const [v1,v2,A1]=pick([[1.5,6,8],[2,5,10],[1,4,12]],s),a=A1*v1/v2;return{t:`Kecepatan air di pipa besar (${A1} cm²) adalah ${f(v1)} m/s. Agar keluar dari nosel dengan kecepatan ${f(v2)} m/s, berapa luas penampang nosel?`,u:"cm²",a,h:"A₂ = A₁v₁/v₂.",s:`A₂ = ${A1}×${f(v1)}/${f(v2)} = ${f(a)} cm²`}}]
},
{ id:3, title:"Persamaan Bernoulli",
  story:["Pegang selembar kertas di depan bibir, lalu tiup bagian atasnya. Kertas justru terangkat ke arah aliran udara.","Udara yang bergerak cepat ternyata mengubah tekanan. Selidiki hubungan tekanan, kecepatan, dan ketinggian pada pipa berisi air yang dilengkapi alat ukur tekanan."],
  pred:{q:"Air mengalir di pipa mendatar yang menyempit. Di bagian sempit air lebih cepat. Tekanan air di bagian sempit akan…",o:["lebih besar","lebih kecil","sama saja"],a:1},
  ctrl:[{k:"v1",l:"Kecepatan di titik 1 (v₁)",u:"m/s",min:1,max:4,step:0.5,v:2},{k:"A2",l:"Luas penampang titik 2 (A₂)",u:"cm²",min:4,max:20,step:2,v:10},{k:"h2",l:"Ketinggian titik 2 (h₂)",u:"m",min:0,max:3,step:0.5,v:0}],
  act:"Catat data",
  cols:[{k:"v1",l:"v₁"},{k:"P1",l:"P₁"},{k:"v2",l:"v₂"},{k:"h2",l:"h₂"},{k:"P2",l:"P₂"},{k:"K1",l:"½ρv₁²",from:3},{k:"K2",l:"½ρv₂²",from:3},{k:"U2",l:"ρgh₂",from:3},{k:"E1",l:"Jumlah 1",from:3},{k:"E2",l:"Jumlah 2",from:3}],
  colNote:"v dalam m/s, h dalam m, tekanan dan suku lainnya dalam kPa. A₁ = 10 cm², h₁ = 0, ρ air = 1000 kg/m³, g = 10 m/s². Jumlah = P + ½ρv² + ρgh.",
  how:["Tahap A: biarkan h₂ = 0, ubah A₂, dan catat tekanan P₂.","Tahap B: buat A₂ = 10 cm² (sama dengan A₁), naikkan h₂, dan catat lagi.","Kumpulkan minimal 5 data: minimal 2 nilai A₂ dan 2 nilai h₂ yang berbeda."],
  req:r=>r.length<5?"Butuh minimal 5 data (sekarang "+r.length+").":new Set(r.map(x=>x.A2)).size<2?"Coba minimal 2 nilai A₂.":new Set(r.map(x=>x.h2)).size<2?"Coba minimal 2 nilai h₂.":null,
  pat:[
   {q:"Pada pipa mendatar, di titik yang kecepatannya lebih besar, tekanannya…",o:["lebih kecil","lebih besar","sama"],a:0,h:"Lihat baris dengan h₂ = 0 dan v₂ > v₁. Bandingkan P₂ dengan P₁.",e:"Kecepatan naik, tekanan turun."},

   {q:"Bandingkan kolom Jumlah 1 dan Jumlah 2 (P + ½ρv² + ρgh).",o:["Selalu sama di kedua titik","Lebih besar di titik 2","Lebih besar di titik 1"],a:0,h:"Baca dua kolom terakhir pada tiap baris.",e:"Jumlah ketiga suku tetap di sepanjang aliran."}],
  bld:[{lhs:"",tip:"Susun persamaan yang berlaku di setiap titik aliran",tok:["P","½ρv²","ρgh","½ρv","ρg","+","×","=","konstan"],ok:a=>{const s=a.join(" ").split(" = ");if(s.length!==2)return false;const [x,y]=s[0]==="konstan"?[s[1],s[0]]:s;return y==="konstan"&&sortEq(x.split(" + "),["P","½ρv²","ρgh"])}}],
  concept:{f:"P + ½ρv² + ρgh = konstan",t:"Persamaan Bernoulli untuk fluida ideal. Antara dua titik: P₁ + ½ρv₁² + ρgh₁ = P₂ + ½ρv₂² + ρgh₂. Ini bentuk hukum kekekalan energi untuk fluida mengalir."},
  qs:[
   s=>{const [v1,P1,v2]=pick([[2,120,6],[1,150,5],[3,200,7]],s),a=P1-0.5*(v2*v2-v1*v1);return{t:`Air mengalir di pipa mendatar. Di titik 1: v = ${v1} m/s dan P = ${P1} kPa. Di titik 2 yang lebih sempit v = ${v2} m/s. Berapa tekanan di titik 2? (ρ = 1000 kg/m³)`,u:"kPa",a,h:"h sama, jadi P₂ = P₁ + ½ρ(v₁² − v₂²).",s:`P₂ = ${P1} kPa + ½·1000·(${v1*v1} − ${v2*v2}) Pa = ${P1} − ${f(0.5*(v2*v2-v1*v1))} = ${f(a)} kPa`}},
   s=>{const [h,P1]=pick([[3,180],[2,140],[4,250]],s),a=P1-10*h;return{t:`Air mengalir naik lewat pipa berpenampang sama ke lantai yang ${h} m lebih tinggi. Tekanan di bawah ${P1} kPa. Berapa tekanan di atas? (g = 10 m/s²)`,u:"kPa",a,h:"v sama, jadi P₂ = P₁ − ρgh.",s:`P₂ = ${P1} kPa − 1000·10·${h} Pa = ${P1} − ${10*h} = ${f(a)} kPa`}},
   s=>{const [A1,A2,v1,h2,P1]=pick([[12,4,1,2,200],[10,5,2,1,160],[9,3,1,3,220]],s),v2=A1*v1/A2,a=P1-0.5*(v2*v2-v1*v1)-10*h2;return{t:`Pipa berpenampang ${A1} cm² (v = ${v1} m/s, P = ${P1} kPa) menyempit menjadi ${A2} cm² sambil naik ${h2} m. Berapa tekanan di ujung atas? (ρ = 1000 kg/m³, g = 10 m/s²)`,u:"kPa",a,h:"Cari v₂ dengan asas kontinuitas, lalu pakai persamaan Bernoulli lengkap.",s:`v₂ = ${A1}·${v1}/${A2} = ${f(v2)} m/s. P₂ = ${P1} − ½(${f(v2*v2)} − ${v1*v1}) − ${10*h2} = ${f(a)} kPa`}}]
},
{ id:4, title:"Gaya Angkat Pesawat",
  story:["Pesawat penumpang bermassa puluhan ton dapat terangkat dari landasan tanpa didorong ke atas oleh mesinnya.","Bentuk dan kemiringan sayap membuat udara di atas sayap mengalir lebih cepat daripada di bawahnya. Di terowongan angin ini kamu mengatur kedua kecepatan itu dan menyelidiki gaya yang muncul."],
  pred:{q:"Udara di atas sayap mengalir lebih cepat daripada di bawah sayap. Menurut Bernoulli, tekanan udara di atas sayap…",o:["lebih besar daripada di bawah","lebih kecil daripada di bawah","sama dengan di bawah"],a:1},
  ctrl:[{k:"v1",l:"Kecepatan udara di atas sayap (v₁)",u:"m/s",min:40,max:110,step:5,v:70},{k:"v2",l:"Kecepatan udara di bawah sayap (v₂)",u:"m/s",min:40,max:90,step:5,v:60},{k:"A",l:"Luas sayap (A)",u:"m²",min:20,max:120,step:10,v:60},{k:"m",l:"Massa pesawat",u:"ton",min:2,max:20,step:1,v:6}],
  act:"Catat data",
  cols:[{k:"v1",l:"v₁ (m/s)"},{k:"v2",l:"v₂ (m/s)"},{k:"A",l:"A (m²)"},{k:"dP",l:"P₂−P₁ (Pa)"},{k:"F",l:"F angkat (kN)"},{k:"W",l:"Berat (kN)"},{k:"st",l:"Gerak"},{k:"dv",l:"v₁²−v₂²",from:3},{k:"r",l:"ΔP/(v₁²−v₂²)",from:3}],
  colNote:"ρ udara = 1,2 kg/m³, g = 10 m/s². P₂ = tekanan di bawah sayap, P₁ = tekanan di atas sayap.",
  how:["Ubah v₁ dan v₂, amati selisih tekanan dan gaya angkat.","Ubah luas sayap dengan kecepatan tetap.","Kumpulkan minimal 5 data. Harus ada minimal satu keadaan pesawat Naik dan satu keadaan Turun."],
  req:r=>r.length<5?"Butuh minimal 5 data (sekarang "+r.length+").":!r.some(x=>x.st==="Naik")?"Belum ada data dengan pesawat Naik.":!r.some(x=>x.st==="Turun")?"Belum ada data dengan pesawat Turun.":null,
  pat:[
   {q:"Lihat kolom terakhir: (P₂−P₁) dibagi (v₁²−v₂²).",o:["Selalu 0,6, yaitu ½ × massa jenis udara","Berubah-ubah tanpa pola","Selalu sama dengan luas sayap"],a:0,h:"ρ udara = 1,2 kg/m³. Berapa setengahnya?",e:"P₂ − P₁ = ½ρ(v₁² − v₂²). Ini persamaan Bernoulli dengan ketinggian yang hampir sama."},
   {q:"Saat luas sayap dibuat 2 kali dengan kecepatan tetap, gaya angkat…",o:["menjadi 2 kali","tetap","menjadi 4 kali"],a:0,h:"Gaya = tekanan × luas.",e:"F = (P₂ − P₁) · A."},
   {q:"Pesawat bergerak naik ketika…",o:["gaya angkat lebih besar daripada berat","gaya angkat sama dengan berat","v₁ lebih kecil dari v₂"],a:0,h:"Bandingkan kolom F angkat dan Berat pada baris Naik.",e:"F > w naik, F = w terbang mendatar, F < w turun."}],
  bld:[{lhs:"F =",tip:"Susun rumus gaya angkat sayap",tok:["½ρ","(v₁² − v₂²)","(v₁ − v₂)","(v₁² + v₂²)","A","×","÷"],ok:a=>!a.includes("÷")&&sortEq(a.filter(x=>x!=="×"),["½ρ","(v₁² − v₂²)","A"])}],
  concept:{f:"F = ½ρ (v₁² − v₂²) A",t:"v₁ kecepatan udara di atas sayap, v₂ di bawah sayap, A luas sayap. Udara lebih cepat di atas, tekanan di atas lebih kecil, dan selisih tekanan mendorong sayap ke atas. Terbang mendatar: F = m·g."},
  qs:[
   s=>{const [v1,v2,A]=pick([[60,50,40],[70,60,50],[50,40,30]],s),a=0.6*(v1*v1-v2*v2)*A;return{t:`Udara mengalir ${v1} m/s di atas sayap dan ${v2} m/s di bawah sayap. Luas sayap ${A} m². Berapa gaya angkatnya? (ρ udara = 1,2 kg/m³)`,u:"N",a,h:"F = ½ρ(v₁² − v₂²)A.",s:`F = ½·1,2·(${v1*v1} − ${v2*v2})·${A} = ${f(a)} N`}},
   s=>{const [v1,v2,A]=pick([[80,70,50],[90,80,40],[100,90,60]],s),a=0.6*(v1*v1-v2*v2)*A/10;return{t:`Pesawat terbang mendatar. Kecepatan udara di atas sayap ${v1} m/s, di bawah ${v2} m/s, luas sayap ${A} m². Berapa massa pesawat? (ρ = 1,2 kg/m³, g = 10 m/s²)`,u:"kg",a,h:"Terbang mendatar berarti F = m·g.",s:`F = ½·1,2·(${v1*v1} − ${v2*v2})·${A} = ${f(a*10)} N. m = F/g = ${f(a)} kg`}},
   s=>{const [m,A,v2]=pick([[3000,50,60],[2400,40,50],[5400,60,70]],s),a=Math.sqrt(v2*v2+m*10/(0.6*A));return{t:`Pesawat ${m} kg dengan luas sayap ${A} m² terbang mendatar. Kecepatan udara di bawah sayap ${v2} m/s. Berapa kecepatan udara di atas sayap? (ρ = 1,2 kg/m³, g = 10 m/s²)`,u:"m/s",a,h:"m·g = ½ρ(v₁² − v₂²)A, lalu selesaikan untuk v₁.",s:`v₁² = v₂² + 2mg/(ρA) = ${v2*v2} + ${f(m*10/(0.6*A))} = ${f(a*a)}. v₁ = ${f(a)} m/s`}}]
},
{ id:5, title:"Teorema Torricelli",
  story:["Sebuah tangki air bocor di tiga tempat: dekat permukaan, di tengah, dan dekat dasar. Ketiga pancaran jatuh di jarak yang berbeda.","Lubang mana yang menyembur paling cepat? Lubang mana yang pancarannya jatuh paling jauh? Jawabannya ternyata tidak sama."],
  pred:{q:"Tangki berdiri di lantai. Agar pancaran air jatuh paling jauh dari tangki, lubang sebaiknya dibuat…",o:["dekat permukaan air","tepat di tengah ketinggian air","dekat dasar tangki"],a:1},
  ctrl:[{k:"H",l:"Tinggi permukaan air dari lantai (H)",u:"m",min:0.5,max:2,step:0.1,v:2},{k:"y",l:"Tinggi lubang dari lantai (y)",u:"m",min:0.1,max:1.9,step:0.05,v:0.5}],
  act:"Catat data",
  cols:[{k:"H",l:"H (m)"},{k:"y",l:"y (m)"},{k:"h",l:"h = H−y (m)"},{k:"v",l:"v (m/s)"},{k:"x",l:"x (m)"},{k:"v2",l:"v²",from:3},{k:"gh",l:"2gh",from:3}],
  colNote:"h = kedalaman lubang di bawah permukaan air, x = jarak jatuh pancaran. g = 10 m/s². Permukaan air dijaga tetap oleh pompa.",
  how:["Biarkan H = 2 m. Geser lubang dari dekat dasar sampai dekat permukaan.","Catat kecepatan semburan v dan jarak jatuh x untuk tiap posisi.","Kumpulkan minimal 5 data dengan minimal 4 posisi lubang berbeda. Cari posisi dengan x terbesar."],
  req:r=>r.length<5?"Butuh minimal 5 data (sekarang "+r.length+").":new Set(r.map(x=>x.y)).size<4?"Coba minimal 4 posisi lubang berbeda.":null,
  pat:[
   {q:"Semakin dalam lubang di bawah permukaan air (h makin besar), kecepatan semburan…",o:["makin besar","makin kecil","tetap"],a:0,h:"Urutkan data menurut h dan lihat kolom v.",e:"Kecepatan semburan hanya bergantung pada kedalaman lubang."},
   {q:"Bandingkan kolom v² dengan 2gh.",o:["Selalu sama","v² selalu lebih besar","Tidak berhubungan"],a:0,h:"Baca dua kolom berwarna pada tiap baris.",e:"v² = 2gh. Sama seperti benda jatuh bebas dari ketinggian h."},
   {q:"Untuk H tetap, pancaran jatuh paling jauh saat lubang berada…",o:["di tengah ketinggian air (y = ½H)","sedekat mungkin dengan dasar","sedekat mungkin dengan permukaan"],a:0,h:"Dengan H = 2 m coba y = 0,5 m; 1,0 m; 1,5 m dan bandingkan x.",e:"Lubang bawah menyembur cepat tetapi cepat sampai ke lantai. Lubang atas lama di udara tetapi lambat. Di tengah, hasil kalinya terbesar: x = 2√(h·y)."}],
  bld:[{lhs:"v =",tip:"Susun rumus kecepatan semburan",tok:["√(","2","g","h","H","½","×",")"],ok:a=>a[0]==="√("&&a[a.length-1]===")"&&sortEq(a.slice(1,-1).filter(x=>x!=="×"),["2","g","h"])}],
  concept:{f:"v = √(2gh)",t:"Teorema Torricelli, turunan persamaan Bernoulli untuk tangki terbuka. h adalah kedalaman lubang dari permukaan. Waktu jatuh t = √(2y/g) dan jarak jatuh x = v·t = 2√(h·y)."},
  qs:[
   s=>{const h=pick([0.8,1.25,0.45],s),a=Math.sqrt(20*h);return{t:`Sebuah tangki berlubang kecil ${f(h)} m di bawah permukaan air. Berapa kecepatan air keluar dari lubang? (g = 10 m/s²)`,u:"m/s",a,h:"v = √(2gh).",s:`v = √(2·10·${f(h)}) = √${f(20*h)} = ${f(a)} m/s`}},
   s=>{const [H,y]=pick([[1.25,0.8],[2.05,1.25],[1.7,0.45]],s),h=H-y,v=Math.sqrt(20*h),t=Math.sqrt(2*y/10),a=v*t;return{t:`Permukaan air tangki ${f(H)} m di atas lantai. Lubang berada ${f(y)} m di atas lantai. Berapa jarak mendatar jatuhnya pancaran air? (g = 10 m/s²)`,u:"m",a,h:"h = H − y. Cari v = √(2gh), waktu jatuh t = √(2y/g), lalu x = v·t.",s:`h = ${f(h)} m, v = ${f(v)} m/s, t = √(2·${f(y)}/10) = ${f(t)} s, x = v·t = ${f(a)} m`}},
   s=>{const [A,h]=pick([[2,1.25],[5,0.8],[4,0.45]],s),v=Math.sqrt(20*h),a=A*v*0.1;return{t:`Lubang seluas ${A} cm² berada ${f(h)} m di bawah permukaan air tangki. Berapa debit air yang bocor? (g = 10 m/s²)`,u:"L/s",a,h:"Gabungkan v = √(2gh) dengan Q = A·v.",s:`v = ${f(v)} m/s. Q = ${A}×10⁻⁴ × ${f(v)} = ${f(a/1000,5)} m³/s = ${f(a)} L/s`}}]
},
{ id:6, title:"Venturimeter",
  story:["Petugas PDAM perlu tahu kecepatan air di dalam pipa tertutup tanpa membongkar pipanya. Mereka memasang pipa yang menyempit di tengah dan dua tabung tegak di atasnya.","Alat ini disebut venturimeter. Selidiki bagaimana selisih tinggi air di kedua tabung bisa memberi tahu kecepatan aliran."],

  colNote:"h = selisih tinggi air di kedua tabung. Pada kolom 2gh, h dalam meter dan g = 10 m/s².",
  how:["Ubah v₁ dan amati selisih tinggi air h di kedua tabung.","Ubah A₂ dengan v₁ tetap dan amati lagi.","Kumpulkan minimal 5 data: minimal 3 nilai v₁ dan 2 nilai A₂ yang berbeda."],
  req:r=>r.length<5?"Butuh minimal 5 data (sekarang "+r.length+").":new Set(r.map(x=>x.v1)).size<3?"Coba minimal 3 nilai v₁.":new Set(r.map(x=>x.A2)).size<2?"Coba minimal 2 nilai A₂.":null,
  pat:[
   {q:"Tabung di atas bagian sempit airnya lebih rendah. Artinya tekanan di bagian sempit…",o:["lebih kecil","lebih besar","sama"],a:0,h:"Tinggi air di tabung sebanding dengan tekanan di bawahnya.",e:"Di bagian sempit air lebih cepat sehingga tekanannya lebih kecil. Selisih tekanan P₁ − P₂ = ρgh."},
   {q:"Bandingkan kolom v₂²−v₁² dengan kolom 2gh.",o:["Selalu sama","2gh selalu lebih besar","Tidak berhubungan"],a:0,h:"Baca dua kolom berwarna di tiap baris.",e:"Dari Bernoulli: P₁ − P₂ = ½ρ(v₂² − v₁²) = ρgh, sehingga v₂² − v₁² = 2gh."},
   {q:"Petugas hanya tahu A₁, A₂, dan h. Bagaimana ia memperoleh v₁?",o:["Mengganti v₂ dengan (A₁/A₂)·v₁ dari asas kontinuitas, lalu menyelesaikan v₁","Tidak mungkin tanpa mengukur v₂","Cukup v₁ = √(2gh) seperti Torricelli"],a:0,h:"Ingat A₁v₁ = A₂v₂.",e:"v₁²[(A₁/A₂)² − 1] = 2gh. Kecepatan didapat hanya dari ukuran pipa dan h."}],
  bld:[{lhs:"v₁ =",tip:"Susun rumus venturimeter",tok:["√(","2gh","gh","÷","×","((A₁/A₂)² − 1)","((A₁/A₂)² + 1)",")"],ok:a=>a.join("")==="√(2gh÷((A₁/A₂)² − 1))"}],
  concept:{f:"v₁ = √( 2gh / [(A₁/A₂)² − 1] )",t:"Venturimeter tanpa manometer mengukur kelajuan zat cair dalam pipa. h adalah selisih tinggi zat cair pada kedua tabung, A₁ penampang lebar, A₂ penampang sempit."},
  qs:[
   s=>{const [A1,A2,h]=pick([[10,5,15],[12,4,160],[8,4,135]],s),a=Math.sqrt(20*h/100/((A1/A2)**2-1));return{t:`Venturimeter memiliki penampang ${A1} cm² dan ${A2} cm². Selisih tinggi air pada kedua tabung ${h} cm. Berapa kecepatan air di penampang besar? (g = 10 m/s²)`,u:"m/s",a,h:"v₁ = √(2gh / [(A₁/A₂)² − 1]), h dalam meter.",s:`v₁ = √(2·10·${f(h/100)} / (${f((A1/A2)**2)} − 1)) = ${f(a)} m/s`}},
   s=>{const [v1,v2]=pick([[1,3],[2,4],[1,5]],s),a=(v2*v2-v1*v1)/20*100;return{t:`Air mengalir ${v1} m/s di bagian lebar venturimeter dan ${v2} m/s di bagian sempit. Berapa selisih tinggi air pada kedua tabung? (g = 10 m/s²)`,u:"cm",a,h:"v₂² − v₁² = 2gh.",s:`h = (${v2*v2} − ${v1*v1}) / 20 = ${f(a/100)} m = ${f(a)} cm`}},

},
{ id:7, title:"Tabung Pitot",

function renderNotes(){
  V.innerHTML=`<div class="note">${groupForm(false)}<div class="card"><h2>Catatan Lab</h2><p>Semua prediksi, data, rumus, dan kesimpulan kelompokmu terkumpul di sini. Unduh sebagai PDF untuk dikumpulkan, atau salin teksnya.</p><div class="row"><button class="btn" id="pdf">Unduh laporan PDF</button><button class="btn ghost" id="copy">Salin laporan</button><button class="btn ghost" id="reset">Hapus semua progres</button><small class="m" id="cmsg"></small></div></div>`+
  M.map(m=>{const st=ms(m.id);return`<div class="card"><h2>Misi ${m.id}: ${m.title} <span class="tag ${st.done?"ok":""}">${st.done?"Selesai, "+pts(m.id)+"/30":"Tahap "+(st.stage+1)+" dari 6"}</span></h2>${st.pred!==null?`<p><b>Prediksi:</b> ${m.pred.o[st.pred]}</p>`:""}${st.rows.length?`<div class="tblwrap"><table><thead><tr>${m.cols.map(c=>`<th>${c.l}</th>`).join("")}</tr></thead><tbody>${st.rows.map(r=>`<tr>${m.cols.map(c=>`<td>${cell(r[c.k],c.k)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}${st.bld.length&&m.bld.every((b,i)=>st.bld[i])?`<p><b>Rumus yang ditemukan:</b> ${m.concept.f}</p>`:""}${st.concl?`<p><b>Kesimpulan:</b> ${esc(st.concl)}</p>`:""}${st.pred===null?`<p class="empty">Belum ada catatan.</p>`:""}</div>`}).join("")+
  `<div class="card"><h2>Misi Akhir <span class="tag ${ms(FID).done?"ok":""}">${ms(FID).done?"Selesai, ":""}${pts(FID)}/50</span></h2></div></div>`;
}

/* ---------- PDF ---------- */
const ps=s=>String(s).replace(/₁/g,"1").replace(/₂/g,"2").replace(/ρ'/g,"rho' ").replace(/ρ/g,"rho ").replace(/√/g,"akar").replace(/Δ/g,"delta ").replace(/[−–]/g,"-").replace(/·/g,".").replace(/[^\x00-\xFF]/g,"");
function makePdf(only){
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),L=15,Wd=180;let y=18;
  const need=h=>{if(y+h>282){d.addPage();y=18;}};
  const line=(s,sz=10,b=false)=>{d.setFont("helvetica",b?"bold":"normal");d.setFontSize(sz);d.splitTextToSize(ps(s),Wd).forEach(t=>{need(6);d.text(t,L,y);y+=sz*0.5;});};
  const tbl=(head,rows)=>{const w=Wd/head.length;d.setFontSize(7.5);
    const row=(cells,b)=>{need(6);d.setFont("helvetica",b?"bold":"normal");cells.forEach((c,i)=>d.text(ps(c),L+i*w+1,y));d.setDrawColor(170);d.line(L,y+1.5,L+Wd,y+1.5);y+=5;};
    row(head,true);rows.forEach(r=>row(r,false));y+=2;};
  line("Laporan Virtual Lab Fluida Dinamis",16,true);y+=2;
  line("Kelas: "+(S.kelas||"-"));line("Kelompok: "+(S.kelompok||"-"));line("Anggota:");members().forEach((a,i)=>line("   "+(i+1)+". "+a));
  line("Tanggal: "+new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}));
  M.filter(m=>!only||m.id===only).forEach(m=>{const st=ms(m.id);y+=4;need(20);line(`Misi ${m.id}: ${m.title}`,12,true);y+=1;
    line(st.done?`Status: selesai, skor ${pts(m.id)} dari 30`:"Status: belum selesai");
    if(st.pred!==null)line("Prediksi: "+m.pred.o[st.pred]);
    if(st.rows.length){y+=2;tbl(m.cols.map(c=>c.l),st.rows.map(r=>m.cols.map(c=>cell(r[c.k],c.k))));line("Keterangan: "+m.colNote,8);}
    if(st.bld.length&&m.bld.every((b,i)=>st.bld[i]))line("Rumus yang ditemukan: "+m.concept.f,10,true);
    if(st.concl)line("Kesimpulan: "+st.concl);});
  if(!only){y+=4;line("Misi Akhir: skor "+pts(FID)+" dari 50",12,true);y+=1;line("Skor total: "+total()+" dari "+TOT,12,true);}
  return d;}
async function savePdf(only){
  const say=t=>{const e=$(only?"#actmsg":"#cmsg");if(e)e.textContent=t;};
  if(!window.jspdf){say("Pembuat PDF tidak termuat (perlu internet). Memakai dialog cetak: pilih Simpan sebagai PDF.");try{window.print();}catch(e){}return;}
  let d;try{d=makePdf(only);}catch(e){say("Gagal membuat PDF. Gunakan Salin laporan.");return;}
  const name="Laporan "+(only?"Misi "+only+" "+M[only-1].title:"Fluida Dinamis")+" "+(S.kelas||"")+" Kelompok "+(S.kelompok||"")+".pdf";
  let dl=null;if(window.claude&&window.claude.use){say("Menyiapkan unduhan…");try{dl=await window.claude.use("downloads");}catch(e){}}
  if(dl){try{await dl.save({filename:name,data:d.output("blob")});say("Laporan PDF tersimpan.");}catch(e){say(e&&e.code==="declined"?"Unduhan dibatalkan.":"Unduhan tidak tersedia di tampilan ini. Gunakan Salin laporan.");}}
  else{try{d.save(name);say("Laporan PDF diunduh.");}catch(e){say("Unduhan tidak tersedia. Gunakan Salin laporan.");}}
}

/* ---------- Interaksi ---------- */
function checkQ(i,defs,id){
  const st=ms(id),q=defs[i](st.seed+i),inp=$("#q"+i),raw=String(inp.value).trim().replace(/\s/g,"");
  const xs=raw.includes(",")?[parseFloat(raw.replace(/\./g,"").replace(",","."))]:[parseFloat(raw),parseFloat(raw.replace(/\./g,""))];
  if(isNaN(xs[0])){inp.focus();return;}
  const hit=xs.some(x=>Math.abs(x-q.a)<=Math.max(.02*Math.abs(q.a),.01));
  const a=st.q[i]||(st.q[i]={w:0});
  if(hit){a.done=true;a.p=[10,7,4][a.w]||4;}
  else{a.w++;if(a.w>=3){a.done=true;a.p=2;}}
  if(defs.every((d,j)=>st.q[j]&&st.q[j].done))st.done=true;
  save();render();
}
V.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(b.id==="gstart"){msg=groupOk()?"":"Isi kelas dan minimal 3 nama anggota.";render();return;}
  if(cur===NID){
    if(b.id==="pdf"){savePdf();return;}
    if(b.id==="copy"){const t=report();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$("#cmsg").textContent="Laporan tersalin. Tempel di tempat pengumpulan tugas.").catch(()=>{$("#cmsg").textContent="Salin otomatis gagal. Blok teks di bawah lalu salin manual.";const ta=document.createElement("textarea");ta.value=t;ta.style.minHeight="240px";b.closest(".card").appendChild(ta);ta.select();});}
    if(b.id==="reset"){if(b.dataset.sure){S.m={};save();P={};RT={};location.hash="misi-1";route();}else{b.dataset.sure=1;b.textContent="Yakin? Klik sekali lagi untuk menghapus";}}
    return;}
  if(cur===FID){if(d.q!==undefined)checkQ(+d.q,FINAL.qs,FID);return;}
  if(cur>NM)return;
  if(b.id==="pdfm"){savePdf(cur);return;}
  const m=M[cur-1],st=ms(cur);msg="";
  if(b.id==="act"){if(cur===1){RT[1].run=true;RT[1].t=0;RT[1].fill=0;}else addRow(calc[cur](P[cur]));return;}
  if(b.id==="clr"){st.rows=[];if(cur===1)RT[1]={t:0,fill:0,pts:RT[1].pts};save();render();return;}
  if(d.go!==undefined){view=+d.go;render();return;}
  if(d.pred!==undefined){st.pred=+d.pred;save();render();return;}
  if(d.pat!==undefined){st.pat[+d.pat]=(+d.o===m.pat[+d.pat].a)?true:+d.o;save();render();return;}
  if(d.add!==undefined){(CH[cur+"_"+d.add]=CH[cur+"_"+d.add]||[]).push(d.t);render();return;}
  if(d.rm!==undefined){CH[cur+"_"+d.rm].splice(+d.j,1);render();return;}
  if(d.chk!==undefined){const i=+d.chk,ch=CH[cur+"_"+i]||[];if(m.bld[i].ok(ch)){st.bld[i]=ch.join(" ");RT["bmsg"+cur+i]="";save();}else RT["bmsg"+cur+i]=ch.length?"Belum sesuai dengan pola datamu. Lihat lagi jawabanmu di tahap Temukan Pola.":"Susun dulu keping-kepingnya.";render();return;}
  if(d.q!==undefined){checkQ(+d.q,m.qs,cur);return;}
  if(d.next!==undefined){
    if(view===4&&st.concl.trim().length<15){msg="Tulis kesimpulanmu dulu, minimal satu kalimat.";render();return;}
    view=Math.min(5,view+1);if(view>st.stage)st.stage=view;save();render();}
});
V.addEventListener("input",e=>{
  const t=e.target;
  if(t.id.startsWith("g_")){const k=t.id.slice(2);if(/^a\d$/.test(k))S.anggota[+k[1]]=t.value;else S[k]=t.value;save();hdr();return;}
  if(t.id==="concl"){ms(cur).concl=t.value;save();return;}
  if(t.dataset.k&&cur<=NM){const p=P[cur];p[t.dataset.k]=+t.value;
    if(cur===6&&p.A2>p.A1-2){p.A2=p.A1-2;$("#c_A2").value=p.A2;}
    if(cur===5){const mx=Math.round((p.H-0.1)*20)/20;if(p.y>mx){p.y=mx;$("#c_y").value=mx;}}
    if(cur===1)RT[1]={t:0,fill:0,pts:RT[1].pts};
    M[cur-1].ctrl.forEach(x=>{$("#v_"+x.k).textContent=lab(x,p[x.k]);});}
});
V.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="unlock"){const v=$("#kode").value.trim().toUpperCase();if(v===M[cur-2].code){ms(cur).open=true;save();route();}else{msg="Kode belum cocok. Periksa lagi kode dari akhir misi sebelumnya.";render();}}});
V.addEventListener("keydown",e=>{if(e.key==="Enter"&&/^q\d$/.test(e.target.id)){const b=e.target.parentElement.querySelector("[data-q]");if(b)b.click();}});
window.addEventListener("hashchange",()=>{V.innerHTML="";route();});
route();requestAnimationFrame(frame);
</script>
